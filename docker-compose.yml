networks:
  mysql-repl:

services:
  mysql-master:
    image: mysql:8.0.36
    container_name: mysql-master
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REPL_USER: ${REPL_USER}
      REPL_PASSWORD: ${REPL_PASSWORD}
    volumes:
      - master-data:/var/lib/mysql
      - ./master/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./init/master:/docker-entrypoint-initdb.d
    networks:
      - mysql-repl
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5
      start_period: 30s

  mysql-slave1:
    image: mysql:8.0.36
    container_name: mysql-slave1
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REPL_USER: ${REPL_USER}
      REPL_PASSWORD: ${REPL_PASSWORD}
    depends_on:
      - mysql-master
    volumes:
      - slave1-data:/var/lib/mysql
      - ./slave/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./init/slave:/docker-entrypoint-initdb.d
    networks:
      - mysql-repl

  mysql-slave2:
    image: mysql:8.0.36
    container_name: mysql-slave2
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REPL_USER: ${REPL_USER}
      REPL_PASSWORD: ${REPL_PASSWORD}
    depends_on:
      - mysql-master
    volumes:
      - slave2-data:/var/lib/mysql
      - ./slave/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./init/slave:/docker-entrypoint-initdb.d
    networks:
      - mysql-repl

  phpmyadmin-master:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin-master
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql-master
      PMA_PORT: 3306
    networks:
      - mysql-repl

  proxysql:
    image: proxysql/proxysql
    container_name: proxysql
    restart: always
    depends_on:
      - mysql-master
      - mysql-slave1
      - mysql-slave2
    ports:
      - "6032:6032"  # admin
      - "3306:6033"  # client
    volumes:
      - proxysql-data:/var/lib/proxysql
      - ./init/proxysql:/init/proxysql:ro
    entrypoint: /init/proxysql/entrypoint.sh
    env_file:
      - .env
    networks:
      - mysql-repl

volumes:
  master-data:
  slave1-data:
  slave2-data:
  proxysql-data:
